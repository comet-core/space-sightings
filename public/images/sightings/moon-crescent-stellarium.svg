<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#020611;font-family:monospace;">
  <defs>
    <radialGradient id="skyGradMoon" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#09142f" />
      <stop offset="70%" stop-color="#030814" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>
    <filter id="neonGlowMoon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#skyGradMoon)" />

  <!-- Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6">
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
  </g>

  <g fill="#475569" font-size="11">
    <text x="15" y="195">DEC +22°00'00"</text>
    <text x="15" y="395">DEC +20°14'18"</text>
    <text x="15" y="595">DEC +18°00'00"</text>
    <text x="305" y="30">RA 05h 40m</text>
    <text x="605" y="30">RA 05h 52m 11s</text>
    <text x="905" y="30">RA 06h 05m</text>
  </g>

  <!-- Constellation Gemini / Taurus border lines -->
  <g stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="280" y1="220" x2="420" y2="480" />
    <line x1="420" y1="480" x2="520" y2="620" />
    <line x1="780" y1="210" x2="940" y2="420" />
  </g>
  <text x="350" y="320" fill="#38bdf8" font-size="13" font-weight="bold" letter-spacing="2" opacity="0.6">GEMINI</text>

  <!-- Lunar Disc in Stellarium -->
  <circle cx="600" cy="400" r="140" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.8" />
  <!-- Crescent slice -->
  <path d="M 600 260 A 140 140 0 0 1 600 540 A 120 140 0 0 0 600 260 Z" fill="#e2e8f0" opacity="0.9" />

  <!-- Telrad Sight Reticle -->
  <g stroke="#ef4444" stroke-width="1.5" fill="none" filter="url(#neonGlowMoon)">
    <circle cx="600" cy="400" r="45" stroke-dasharray="8,6" />
    <circle cx="600" cy="400" r="140" stroke-dasharray="14,10" />
    <circle cx="600" cy="400" r="260" stroke-dasharray="20,15" />
    <line x1="600" y1="120" x2="600" y2="350" />
    <line x1="600" y1="450" x2="600" y2="680" />
    <line x1="320" y1="400" x2="550" y2="400" />
    <line x1="650" y1="400" x2="880" y2="400" />
    <circle cx="600" cy="400" r="2" fill="#ef4444" />
  </g>

  <!-- Telemetry HUD Box -->
  <rect x="50" y="50" width="370" height="150" fill="#030712" fill-opacity="0.85" stroke="#ef4444" stroke-width="1" rx="4" />
  <g fill="#f87171" font-size="11" letter-spacing="1">
    <text x="70" y="80" font-weight="bold" fill="#ffffff" font-size="13">STELLARIUM SKY MAP ALIGNMENT</text>
    <text x="70" y="105">OBJECT: MOON (LUNA)</text>
    <text x="70" y="125">APP MAG: -9.80 · ILLUM: 18.2% (WAXING)</text>
    <text x="70" y="145">COORDS: RA 05h 52m 11s · DEC +20°14'18"</text>
    <text x="70" y="165">FOV: 4.0° TELRAD · ALT: +32°10' · AZ: 254°</text>
    <text x="70" y="185" fill="#34d399">STATUS: SOLVED &amp; VERIFIED</text>
  </g>

  <text x="1140" y="760" fill="#ef4444" text-anchor="end" font-size="13" opacity="0.85">STELLARIUM RETICLE VERIFICATION OVERLAY</text>
</svg>

