<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#020611;font-family:monospace;">
  <defs>
    <radialGradient id="skyGradM42" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#09142f" />
      <stop offset="70%" stop-color="#030814" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>
    <filter id="neonGlowM42" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#skyGradM42)" />

  <!-- Coordinate Grid -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6">
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
  </g>

  <g fill="#475569" font-size="11">
    <text x="15" y="195">DEC -04°00'00"</text>
    <text x="15" y="395">DEC -05°23'28"</text>
    <text x="15" y="595">DEC -07°00'00"</text>
    <text x="305" y="30">RA 05h 30m</text>
    <text x="605" y="30">RA 05h 35m 17s</text>
    <text x="905" y="30">RA 05h 40m</text>
  </g>

  <!-- Constellation Orion Belt and Sword -->
  <g stroke="#3b82f6" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4,4">
    <!-- Belt line (Alnitak, Alnilam, Mintaka) -->
    <line x1="380" y1="180" x2="600" y2="150" />
    <line x1="600" y1="150" x2="820" y2="120" />
    <!-- Line down into sword -->
    <line x1="600" y1="150" x2="600" y2="400" stroke="#f43f5e" stroke-opacity="0.4" />
    <line x1="600" y1="400" x2="600" y2="620" />
  </g>

  <!-- Belt Stars -->
  <circle cx="380" cy="180" r="5" fill="#bae6fd" />
  <text x="395" y="185" fill="#94a3b8" font-size="10">ζ Ori (Alnitak)</text>
  <circle cx="600" cy="150" r="5.5" fill="#bae6fd" />
  <text x="615" y="155" fill="#94a3b8" font-size="10">ε Ori (Alnilam)</text>
  <circle cx="820" cy="120" r="5" fill="#bae6fd" />
  <text x="835" y="125" fill="#94a3b8" font-size="10">δ Ori (Mintaka)</text>

  <!-- M42 Nebula Marker in Stellarium -->
  <ellipse cx="600" cy="400" rx="35" ry="25" fill="#db2777" fill-opacity="0.3" stroke="#f43f5e" stroke-width="1.5" />
  <text x="645" y="405" fill="#f43f5e" font-size="12" font-weight="bold">M42 (NGC 1976)</text>

  <!-- Telrad Sight Reticle -->
  <g stroke="#ef4444" stroke-width="1.5" fill="none" filter="url(#neonGlowM42)">
    <circle cx="600" cy="400" r="45" stroke-dasharray="8,6" />
    <circle cx="600" cy="400" r="140" stroke-dasharray="14,10" />
    <circle cx="600" cy="400" r="260" stroke-dasharray="20,15" />
    <line x1="600" y1="120" x2="600" y2="350" />
    <line x1="600" y1="450" x2="600" y2="680" />
    <line x1="320" y1="400" x2="550" y2="400" />
    <line x1="650" y1="400" x2="880" y2="400" />
    <circle cx="600" cy="400" r="2" fill="#ef4444" />
  </g>

  <!-- Telemetry Box -->
  <rect x="50" y="50" width="370" height="150" fill="#030712" fill-opacity="0.85" stroke="#ef4444" stroke-width="1" rx="4" />
  <g fill="#f87171" font-size="11" letter-spacing="1">
    <text x="70" y="80" font-weight="bold" fill="#ffffff" font-size="13">STELLARIUM SKY MAP ALIGNMENT</text>
    <text x="70" y="105">OBJECT: MESSIER 42 (ORION NEBULA)</text>
    <text x="70" y="125">APP MAG: +4.00 · TYPE: EMISSION NEBULA</text>
    <text x="70" y="145">COORDS: RA 05h 35m 17s · DEC -05°23'28"</text>
    <text x="70" y="165">FOV: 4.0° TELRAD · ALT: +54°12' · AZ: 182°</text>
    <text x="70" y="185" fill="#34d399">STATUS: SOLVED &amp; VERIFIED</text>
  </g>

  <text x="1140" y="760" fill="#ef4444" text-anchor="end" font-size="13" opacity="0.85">STELLARIUM RETICLE VERIFICATION OVERLAY</text>
</svg>

