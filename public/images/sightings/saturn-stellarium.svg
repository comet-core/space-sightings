<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#020611;font-family:monospace;">
  <defs>
    <!-- Background Space & Constellation Lines -->
    <radialGradient id="skyGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#081026" />
      <stop offset="70%" stop-color="#030814" />
      <stop offset="100%" stop-color="#010307" />
    </radialGradient>
    
    <!-- Telrad Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Stellarium Equatorial Coordinate Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4,6">
    <!-- Declination Lines -->
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <!-- RA Lines -->
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
  </g>

  <!-- Coordinate Grid Labels -->
  <g fill="#475569" font-size="11">
    <text x="15" y="195">DEC -10°00'00"</text>
    <text x="15" y="395">DEC -12°38'05"</text>
    <text x="15" y="595">DEC -15°00'00"</text>
    <text x="305" y="30">RA 22h 10m</text>
    <text x="605" y="30">RA 22h 17m 42s</text>
    <text x="905" y="30">RA 22h 25m</text>
  </g>

  <!-- Constellation Boundaries & Lines (Aquarius & Cetus) -->
  <g stroke="#2563eb" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3,3">
    <!-- Aquarius stick -->
    <line x1="220" y1="120" x2="420" y2="260" />
    <line x1="420" y1="260" x2="520" y2="340" />
    <line x1="520" y1="340" x2="380" y2="490" />
    <!-- Cetus border -->
    <line x1="720" y1="310" x2="880" y2="450" />
    <line x1="880" y1="450" x2="1050" y2="410" />
  </g>

  <g fill="#38bdf8" font-size="13" font-weight="bold" letter-spacing="2" opacity="0.6">
    <text x="380" y="240">AQUARIUS</text>
    <text x="820" y="390">CETUS</text>
  </g>

  <!-- Star Field (Accurate magnitudes) -->
  <g>
    <!-- Sadalsuud (Beta Aquarii) -->
    <circle cx="220" cy="120" r="3.5" fill="#e0f2fe" />
    <text x="235" y="125" fill="#94a3b8" font-size="10">β Aqr (Sadalsuud)</text>

    <!-- Skat (Delta Aquarii) -->
    <circle cx="380" cy="490" r="3" fill="#e0f2fe" />
    <text x="395" y="495" fill="#94a3b8" font-size="10">δ Aqr (Skat)</text>

    <!-- Faint stars -->
    <circle cx="510" cy="350" r="2" fill="#cbd5e1" />
    <circle cx="680" cy="450" r="1.5" fill="#cbd5e1" />
    <circle cx="720" cy="310" r="2.8" fill="#e0f2fe" />
    <circle cx="880" cy="450" r="3" fill="#fef08a" />
    <circle cx="1050" cy="410" r="2.5" fill="#cbd5e1" />
  </g>

  <!-- Saturn Target Marker -->
  <circle cx="600" cy="400" r="7" fill="#fbbf24" />
  <circle cx="600" cy="400" r="12" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.8" />

  <!-- Stellarium Telrad Sight Reticle (Red Neon) -->
  <g stroke="#ef4444" stroke-width="1.5" fill="none" filter="url(#neonGlow)">
    <!-- 0.5 Degree Ring -->
    <circle cx="600" cy="400" r="45" stroke-dasharray="8,6" />
    <!-- 2.0 Degree Ring -->
    <circle cx="600" cy="400" r="140" stroke-dasharray="14,10" />
    <!-- 4.0 Degree Ring -->
    <circle cx="600" cy="400" r="260" stroke-dasharray="20,15" />
    
    <!-- Crosshairs (leaving center open) -->
    <line x1="600" y1="120" x2="600" y2="350" />
    <line x1="600" y1="450" x2="600" y2="680" />
    <line x1="320" y1="400" x2="550" y2="400" />
    <line x1="650" y1="400" x2="880" y2="400" />

    <!-- Center Reticle Pips -->
    <circle cx="600" cy="400" r="2" fill="#ef4444" />
  </g>

  <!-- Stellarium Telemetry Box & Reticle Badge -->
  <rect x="50" y="50" width="360" height="150" fill="#030712" fill-opacity="0.85" stroke="#ef4444" stroke-width="1" rx="4" />
  <g fill="#f87171" font-size="11" letter-spacing="1">
    <text x="70" y="80" font-weight="bold" fill="#ffffff" font-size="13">STELLARIUM SKY MAP ALIGNMENT</text>
    <text x="70" y="105">OBJECT: SATURN (PLANET)</text>
    <text x="70" y="125">APP MAG: +0.65 · PHASE: 99.8%</text>
    <text x="70" y="145">COORDS: RA 22h 17m 42s · DEC -12°38'05"</text>
    <text x="70" y="165">FOV: 4.0° TELRAD · ALT: +41°22' · AZ: 174°</text>
    <text x="70" y="185" fill="#34d399">STATUS: SOLVED &amp; VERIFIED</text>
  </g>

  <!-- Status Watermark -->
  <text x="1140" y="760" fill="#ef4444" text-anchor="end" font-size="13" opacity="0.85">STELLARIUM RETICLE VERIFICATION OVERLAY</text>
</svg>

