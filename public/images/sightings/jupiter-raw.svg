<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#030409;font-family:monospace;">
  <defs>
    <radialGradient id="spaceG" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#090b14" />
      <stop offset="60%" stop-color="#04050a" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>
    
    <!-- Jupiter Disk Glow -->
    <radialGradient id="jupGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#fed7aa" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Jovian Disk Shading -->
    <radialGradient id="jupGlobe" cx="44%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="35%" stop-color="#ffedd5" />
      <stop offset="75%" stop-color="#fed7aa" />
      <stop offset="92%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    
    <!-- Clip for planetary sphere -->
    <clipPath id="globeClip">
      <circle cx="600" cy="400" r="110" />
    </clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#spaceG)" />

  <!-- Background Faint Stars -->
  <g opacity="0.5">
    <circle cx="150" cy="220" r="1.1" fill="#ffffff" />
    <circle cx="320" cy="650" r="0.9" fill="#ffffff" />
    <circle cx="980" cy="190" r="1.3" fill="#ffffff" />
    <circle cx="1080" cy="610" r="1.0" fill="#ffffff" />
    <circle cx="480" cy="150" r="0.7" fill="#ffffff" />
    <circle cx="790" cy="680" r="0.8" fill="#ffffff" />
  </g>

  <!-- Atmospheric Bloom -->
  <circle cx="600" cy="400" r="220" fill="url(#jupGlow)" />

  <!-- The Galilean Moons (Orbital Plane angled ~15 deg) -->
  <g transform="translate(600,400) rotate(-14) translate(-600,-400)">
    <!-- Callisto -->
    <circle cx="170" cy="400" r="3.2" fill="#e2e8f0" />
    <text x="170" y="425" fill="#94a3b8" font-size="11" text-anchor="middle">CALLISTO (IV)</text>
    <circle cx="170" cy="400" r="14" stroke="#38bdf8" stroke-width="0.75" fill="none" opacity="0.4" />

    <!-- Ganymede -->
    <circle cx="340" cy="400" r="4.0" fill="#fef08a" />
    <text x="340" y="425" fill="#fef08a" font-size="11" text-anchor="middle">GANYMEDE (III)</text>
    <circle cx="340" cy="400" r="14" stroke="#38bdf8" stroke-width="0.75" fill="none" opacity="0.4" />

    <!-- Io -->
    <circle cx="780" cy="400" r="3.0" fill="#fde047" />
    <text x="780" y="425" fill="#fde047" font-size="11" text-anchor="middle">IO (I)</text>
    <circle cx="780" cy="400" r="14" stroke="#38bdf8" stroke-width="0.75" fill="none" opacity="0.4" />

    <!-- Europa -->
    <circle cx="1020" cy="400" r="2.8" fill="#bae6fd" />
    <text x="1020" y="425" fill="#bae6fd" font-size="11" text-anchor="middle">EUROPA (II)</text>
    <circle cx="1020" cy="400" r="14" stroke="#38bdf8" stroke-width="0.75" fill="none" opacity="0.4" />

    <!-- Orbital Plane Reference Guide Line -->
    <line x1="100" y1="400" x2="1100" y2="400" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="3,6" opacity="0.25" />
  </g>

  <!-- Jupiter Planetary Globe -->
  <circle cx="600" cy="400" r="110" fill="url(#jupGlobe)" />

  <!-- Jovian Cloud Belts (Clipped to Globe) -->
  <g clip-path="url(#globeClip)">
    <!-- North Polar Region -->
    <rect x="480" y="290" width="240" height="25" fill="#a16207" opacity="0.3" />
    
    <!-- North Temperate Belt -->
    <path d="M 480 325 Q 600 320 720 325 L 720 338 Q 600 334 480 338 Z" fill="#9a3412" opacity="0.7" />
    
    <!-- North Equatorial Belt (Prominent, turbulent) -->
    <path d="M 480 350 Q 560 346 640 353 Q 700 348 720 352 L 720 380 Q 640 376 560 382 Q 500 378 480 380 Z" fill="#7c2d12" opacity="0.85" />
    
    <!-- Equatorial Zone (Bright) -->
    <path d="M 480 380 Q 600 382 720 380 L 720 405 Q 600 408 480 405 Z" fill="#ffedd5" opacity="0.6" />
    
    <!-- South Equatorial Belt (with Great Red Spot hollow) -->
    <path d="M 480 405 Q 600 408 720 405 L 720 435 Q 600 438 480 435 Z" fill="#9a3412" opacity="0.85" />
    
    <!-- Great Red Spot (GRS) -->
    <ellipse cx="645" cy="425" rx="20" ry="12" fill="#c2410c" opacity="0.95" />
    <ellipse cx="645" cy="425" rx="13" ry="8" fill="#ea580c" opacity="0.9" />
    <circle cx="644" cy="424" r="5" fill="#fed7aa" opacity="0.6" />

    <!-- South Temperate Belt -->
    <path d="M 480 455 Q 600 458 720 455 L 720 470 Q 600 472 480 470 Z" fill="#78350f" opacity="0.65" />
    
    <!-- South Polar Region -->
    <rect x="480" y="485" width="240" height="30" fill="#713f12" opacity="0.4" />

    <!-- Limb Darkening overlay -->
    <radialGradient id="limbDark" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#000000" stop-opacity="0" />
      <stop offset="97%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9" />
    </radialGradient>
    <circle cx="600" cy="400" r="110" fill="url(#limbDark)" />
  </g>

  <!-- Handheld Sensor Viewfinder UI -->
  <g stroke="#00f0ff" stroke-opacity="0.3" fill="none" stroke-width="1">
    <path d="M 60 60 L 90 60 M 60 60 L 60 90" />
    <path d="M 1140 60 L 1110 60 M 1140 60 L 1140 90" />
    <path d="M 60 740 L 90 740 M 60 740 L 60 710" />
    <path d="M 1140 740 L 1110 740 M 1140 740 L 1140 710" />
  </g>

  <!-- On-Screen Telemetry HUD -->
  <g fill="#00f0ff" opacity="0.85" font-size="12" letter-spacing="1.5">
    <text x="70" y="85">SENSOR: 1/1.3" CMOS TELEPHOTO</text>
    <text x="70" y="105">OPTICS: 120mm EQ + 5x OPTICAL ZOOM</text>
    <text x="70" y="125">EXPOSURE: 1/60s · ISO 200 · STACKED: TRUE (32 FRAMES)</text>
    
    <text x="1130" y="85" text-anchor="end">TARGET: JUPITER (♃) + 4 GALILEAN MOONS</text>
    <text x="1130" y="105" text-anchor="end">DIST: 4.21 AU · 35.0 MIN LIGHT-TIME</text>
    <text x="1130" y="125" text-anchor="end">APP MAG: -2.48 · TAURUS</text>
  </g>
</svg>

